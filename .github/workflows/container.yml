name: Container

# Pull requests: build linux/amd64 only, load it locally and smoke test it.
# main: additionally push a multi-arch `edge` image to GHCR.
# Release tags: push multi-arch `X.Y.Z`, `X.Y`, `X`, `latest` and `sha-*` tags.
# Pushed images carry BuildKit provenance (mode=max) and SBOM attestations and
# a Sigstore-signed GitHub build-provenance attestation stored in the registry.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/container.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/morpheuslord/startup-sbom

jobs:
  image:
    name: build, test, publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
      id-token: write # Sigstore signing for actions/attest
      attestations: write # store the build-provenance attestation
      artifact-metadata: write # attestation storage records
    env:
      # Only the canonical repository publishes; forks and PRs build and test only.
      PUBLISH: ${{ github.repository == 'morpheuslord/Startup-SBOM' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=edge,branch=main
            type=ref,event=pr
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=startup-sbom
            org.opencontainers.image.description=Root-confined static analysis of Linux root filesystems and container images
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/morpheuslord/Startup-SBOM#readme

      - name: Build (linux/amd64) for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: startup-sbom:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run --rm startup-sbom:ci version
          docker run --rm startup-sbom:ci schema > /dev/null
          test "$(docker inspect --format '{{.Config.User}}' startup-sbom:ci)" != ""
          test "$(docker inspect --format '{{.Config.User}}' startup-sbom:ci)" != "root"
          test "$(docker inspect --format '{{.Config.User}}' startup-sbom:ci)" != "0"

      - name: Dogfood - the image scans an exported rootfs (offline, read-only, no network)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dogfood"
          mkdir -p "$work/in" "$work/out"
          cid="$(docker create startup-sbom:ci)"
          docker export -o "$work/in/self.tar" "$cid"
          docker rm "$cid" > /dev/null
          docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /cache \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$work/in:/in:ro" -v "$work/out:/out" \
            startup-sbom:ci scan tar:/in/self.tar --offline -f cyclonedx -f json -o /out
          test -s "$work/out/sbom.cdx.json"
          test -s "$work/out/report.json"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
