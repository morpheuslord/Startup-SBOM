name: zizmor

# Static analysis of the GitHub Actions workflows and the root composite action
# (template injection, unpinned actions, excessive permissions, cache poisoning,
# credential persistence). Findings are uploaded to code scanning.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "action.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # SARIF upload to code scanning
      actions: read # workflow metadata for private repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
