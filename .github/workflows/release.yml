name: Release

# Tag-driven release: `uv version --bump ...`, update CHANGELOG.md, then push a
# tag `vX.Y.Z` (or `vX.Y.ZrcN` / `vX.Y.ZaN` / `vX.Y.ZbN`) that matches the
# version in pyproject.toml. The container image is built and published by the
# `image` job in ci.yml on the same tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.0"

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # never restore caches in a publishing workflow
      - name: Tag must match the project version
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build --no-sources
      - name: Smoke test the wheel in a fresh venv
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/smoke"
          uv venv --python 3.11 "$venv"
          uv pip install --python "$venv/bin/python" dist/*.whl
          "$venv/bin/startup-sbom" version
          "$venv/bin/startup-sbom" schema > /dev/null
      - name: Self-SBOM of runtime dependencies (CycloneDX 1.5)
        run: |
          set -euo pipefail
          mkdir -p sbom
          uv export --frozen --no-dev --format cyclonedx1.5 \
            --output-file "sbom/startup-sbom-${GITHUB_REF_NAME#v}.deps.cdx.json" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-sbom
          path: sbom/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/startup-sbom/
    permissions:
      id-token: write # PyPI Trusted Publishing + Sigstore signing
      attestations: write # GitHub artifact attestations
      artifact-metadata: write # attestation storage records
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Build provenance attestation (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish (PEP 740 attestations are generated by default)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-sbom
          path: sbom/
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "No CHANGELOG.md section for ${version}; using generated notes." > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo
            echo "### Verify"
            echo
            echo '```sh'
            echo "gh attestation verify dist/<file> -R ${GITHUB_REPOSITORY}"
            echo "gh attestation verify oci://ghcr.io/morpheuslord/startup-sbom:${version} -R ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A release made by hand on the Releases page (which also creates the tag
          # and triggers this workflow) is left exactly as it is: title, notes, assets.
          if gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null 2>&1; then
            echo "::notice::A GitHub release for ${GITHUB_REF_NAME} already exists; not creating another."
            exit 0
          fi
          flags=(--verify-tag --title "Startup-SBOM ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md")
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/* sbom/*
