name: Security

# All static security analysis in one workflow, uploading to code scanning:
# CodeQL over the Python sources and the workflows themselves, Codacy's
# security tool suite, and zizmor over the GitHub Actions workflows and the
# root composite action (template injection, unpinned actions, excessive
# permissions, cache poisoning, credential persistence).

on:
  push:
    branches: [main, refactoring] # drop refactoring after the 2.0 merge
  pull_request:
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      actions: read # needed for private forks
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  codacy:
    name: codacy
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # SARIF upload to code scanning
      actions: read # workflow metadata for private repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          # Optional: with CODACY_PROJECT_TOKEN the repository's Codacy configuration
          # is used; without it, the tools run with their default configurations.
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          output: results.sarif
          format: sarif
          # Map non-security issue severities so code scanning shows only real findings.
          gh-code-scanning-compat: true
          # Never fail here; code scanning owns the pass/fail decision on pull requests.
          max-allowed-issues: 2147483647
      - name: Upload Codacy results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: codacy

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # SARIF upload to code scanning
      actions: read # workflow metadata for private repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
