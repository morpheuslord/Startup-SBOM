# Development hooks for this repository. Install with:
#   uv run pre-commit install --install-hooks
# Run everything:
#   uv run pre-commit run --all-files
#
# Remote hooks are pinned to commit SHAs (Dependabot "pre-commit" ecosystem
# keeps them current). ruff and mypy versions match uv.lock where it matters:
# mypy runs from the project environment so it sees the real dependencies.

minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, pre-push]
exclude: ^tests/fixtures/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      # mkdocs.yml uses MkDocs-only `!!python/name:` tags (Material emoji); check its
      # syntax only, without constructing objects.
      - id: check-yaml
        name: check yaml (mkdocs.yml, syntax only)
        args: [--unsafe]
        files: ^mkdocs\.yml$
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d4acaec07ac3bc6017fba3c3b8e9810af1b615db # frozen: 0.13.1
    hooks:
      - id: uv-lock
        name: uv lock --check
        args: [--check]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project environment)
        entry: uv run --frozen mypy
        language: unsupported
        types_or: [python, pyi]
        files: ^src/
        pass_filenames: false
        require_serial: true
